version: '2.1'

suites:
  - name: "Full Stack Test"
    containers:
      - name: backend
        image: photo-upload-backend
        ports:
          - "5000:5000"
        volumes:
          - ./uploads:/uploads
        healthcheck:
          test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
          interval: 5s
          timeout: 5s
          retries: 3

      - name: frontend
        image: photo-upload-frontend
        ports:
          - "3000:3000"
        depends_on:
          backend:
            condition: service_healthy
