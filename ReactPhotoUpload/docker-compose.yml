version: '3.8'

services:
  # Frontend service
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: photo-upload-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  # Backend service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: photo-upload-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - UPLOAD_DIR=/uploads
    volumes:
      # Mount the uploads directory - persists data on the host machine
      - ./uploads:/uploads
      # Alternative: Use a named volume for better portability
      # - uploads_volume:/uploads
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge

# Uncomment below to use named volume instead of bind mount
# volumes:
#   uploads_volume:
#     driver: local
